# == This file defines the page_layouts for new pages.
#
# For further informations please see http://guides.alchemy-cms.com/create_page_layouts.html

- name: home
  unique: true
  elements:
    - hero
    - concept_grid
    - button
    - cta
  autogenerate:
    - hero
    - concept_grid
    - button
    - cta

- name: pages
  elements:
    - section
    - concept_intro
    - prose
    - callout
    - code_sample
  autogenerate:
    - concept_intro
    - prose
    - callout
    - callout
    - code_sample

- name: concept
  elements:
    - section
    - concept_intro
    - prose
    - image_text
    - callout
    - scheduled_note
    - code_sample
  autogenerate:
    - concept_intro
    - prose
    - image_text
    - callout
    - scheduled_note
    - code_sample

- name: gallery_page
  elements:
    - section
    - concept_intro
    - image_gallery
  autogenerate:
    - concept_intro
    - image_gallery

- name: ingredients
  elements:
    - section
    - concept_intro
    - ingredient_catalog
  autogenerate:
    - concept_intro
    - ingredient_catalog

- name: blog_overview
  elements:
    - section
    - concept_intro
  autogenerate:
    - concept_intro

- name: article
  elements:
    - section
    - post_header
    - prose
  autogenerate:
    - post_header
    - prose

- name: contact
  cache: false
  elements:
    - section
    - concept_intro
    - contactform
  autogenerate:
    - concept_intro
    - contactform

- name: thanks
  elements:
    - section
    - concept_intro
  autogenerate:
    - concept_intro

- name: events
  cache: false
  elements:
    - section
    - concept_intro
    - events_overview
    - event_teaser
  autogenerate:
    - concept_intro
    - events_overview
    - events_overview
    - event_teaser
    - event_teaser
    - event_teaser

# global pages

- name: footer
  unique: true
  layoutpage: true
  elements:
    - footer_note
    - footer_nav
  autogenerate:
    - footer_note
    - footer_nav
