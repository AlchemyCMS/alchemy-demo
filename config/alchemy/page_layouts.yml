# == This file defines the page_layouts for new pages.
#
# For further informations please see http://guides.alchemy-cms.com/create_page_layouts.html

- name: intro
  unique: true
  elements:
    - image_teaser
    - intro_text
    - slider
  autogenerate:
    - image_teaser
    - intro_text
    - slider

- name: standard
  elements:
    - text_block
    - content_block
  autogenerate:
    - text_block
    - content_block

- name: content_page
  elements:
    - content_block
    - call_to_action
    - slider
  autogenerate:
    - content_block
    - call_to_action
    - slider

- name: blog
  insert_elements_at: top
  elements:
    - blog_post
  autogenerate:
    - blog_post

- name: category
  elements:
    - category_intro
    - gallery
  autogenerate:
    - category_intro
    - gallery

- name: microsite
  elements:
    - portrait_image
    - slider
  autogenerate:
    - portrait_image
    - slider

# --- Guided tour page layouts (Phase 2.2) ---

- name: home
  unique: true
  elements:
    - hero
    - concept_grid
    - button
    - cta
  autogenerate:
    - hero
    - concept_grid
    - button
    - cta

- name: concept
  elements:
    - concept_intro
    - prose
    - image_text
    - callout
    - code_sample
  autogenerate:
    - concept_intro
    - prose
    - image_text
    - callout
    - code_sample

- name: gallery_page
  elements:
    - concept_intro
    - image_gallery
  autogenerate:
    - concept_intro
    - image_gallery

- name: blog_overview
  elements:
    - concept_intro
  autogenerate:
    - concept_intro

- name: article
  elements:
    - post_header
    - prose
  autogenerate:
    - post_header
    - prose

- name: contact
  cache: false
  elements:
    - concept_intro
    - contactform
  autogenerate:
    - concept_intro
    - contactform

- name: thanks
  elements:
    - concept_intro
  autogenerate:
    - concept_intro

# global pages

- name: footer
  unique: true
  layoutpage: true
  elements:
    - footer_note
    - social_button
  autogenerate:
    - footer_note
