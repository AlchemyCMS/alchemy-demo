# == In this configuration you setup Alchemy´s element layouts.
#
# For further informations please see http://guides.alchemy-cms.com/create_elements.html
- name: footer_note
  unique: true
  ingredients:
    - role: body
      type: Text
      default: "Made with ❤️ and AlchemyCMS"

- name: footer_nav
  unique: true
  hint: true
  ingredients:
    - role: menu
      type: Node
      hint: true

# --- Guided tour elements (Phase 2.2) ---

- name: hero
  unique: true
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :hero_headline
      settings:
        levels: [1]
        sizes: [1, 2]
    - role: subheadline
      type: Text
      hint: true
      default: :hero_subheadline
    - role: cta
      type: Link
      hint: true
      default: "#concepts"
      settings:
        text: Explore the tour
    - role: background_image
      type: Picture
      hint: true
      settings:
        size: 1600x600
        crop: true
        srcset: [800x300, 1600x600]
        sizes: ["100vw"]
    - role: background
      type: Select
      group: styling
      hint: true
      default: bg-surface
      settings:
        select_values:
          - ["Light blue", "bg-surface"]
          - ["Violet tint", "bg-surface-violet"]
          - ["White", "bg-white"]
    - role: filter
      type: Select
      group: styling
      hint: true
      default: ""
      settings:
        select_values:
          - ["None", ""]
          - ["Grayscale", "grayscale"]
          - ["Sepia", "sepia"]
          - ["Blur", "blur-sm"]
          - ["Dim", "brightness-75"]
          - ["Saturate", "saturate-150"]

- name: concept_grid
  unique: true
  hint: true
  nestable_elements:
    - concept_card
  autogenerate:
    - concept_card
    - concept_card
    - concept_card
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :concepts_headline
      settings:
        anchor: concepts
        levels: [2, 3]
        sizes: [2, 3]

- name: concept_card
  hint: true
  ingredients:
    - role: illustration
      type: Picture
      hint: true
    - role: title
      type: Headline
      hint: true
      default: :concept_card_title
      validate:
        - presence
      settings:
        levels: [3, 4]
        sizes: [4, 5]
    - role: description
      type: Richtext
      hint: true
      default: :concept_card_description
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: link
      type: Text
      hint: true
      default: Learn more
      settings:
        linkable: true

- name: cta
  unique: true
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :cta_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]
    - role: text
      type: Richtext
      hint: true
      default: :cta_text
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: button
      type: Link
      hint: true
      default: "/admin"
      settings:
        text: Open the admin
    - role: background
      type: Select
      group: styling
      hint: true
      default: bg-accent
      settings:
        select_values:
          - ["Accent violet", "bg-accent"]
          - ["Ink", "bg-ink"]
    - role: button_style
      type: Select
      group: styling
      hint: true
      default: "bg-white text-accent-dark"
      settings:
        select_values:
          - ["Light button", "bg-white text-accent-dark"]
          - ["Dark button", "bg-ink text-white"]

- name: button
  hint: true
  ingredients:
    - role: label
      type: Link
      hint: true
      default: "#concepts"
      settings:
        text: See the concepts
    - role: color
      type: Color
      group: styling
      hint: true
      default: "#884cbe"
      settings:
        custom_color: true
        colors:
          - ["Accent violet", "#884cbe"]
          - ["Emerald", "#10b981"]
          - ["Ink", "#323a3d"]

# --- Concept page elements (Phase 2.2) ---

- name: concept_intro
  hint: true
  ingredients:
    - role: eyebrow
      type: Text
      hint: true
      default: :concept_intro_eyebrow
    - role: headline
      type: Headline
      as_element_title: true
      hint: true
      default: :concept_intro_headline
      settings:
        levels: [1, 2]
        sizes: [1, 2]
        anchor: from_value
    - role: lead
      type: Richtext
      hint: true
      default: :concept_intro_lead
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]

- name: prose
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :prose_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]
    - role: text
      type: Richtext
      hint: true
      default: :prose_text
      settings:
        tinymce:
          toolbar: "bold italic | bullist numlist | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a, ul, ol, li]
          attributes: [href, target, rel, title]

- name: image_text
  hint: true
  ingredients:
    - role: image
      type: Picture
      hint: true
      settings:
        size: 640x480
        srcset: [320x240, 640x480]
        sizes: ["(min-width: 768px) 50vw", "100vw"]
    - role: headline
      type: Headline
      as_element_title: true
      hint: true
      default: :image_text_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]
    - role: text
      type: Richtext
      hint: true
      default: :image_text_text
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: layout
      type: Select
      group: styling
      hint: true
      default: "md:flex-row"
      settings:
        select_values:
          - ["Image left", "md:flex-row"]
          - ["Image right", "md:flex-row-reverse"]

- name: callout
  hint: true
  ingredients:
    - role: variant
      type: Select
      group: styling
      hint: true
      default: info
      settings:
        select_values:
          - ["Info", "info"]
          - ["Tip", "tip"]
          - ["Warning", "warning"]
    - role: text
      type: Richtext
      hint: true
      default: :callout_text
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]

- name: scheduled_note
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      settings:
        levels: [2, 3]
        sizes: [3, 4]
    - role: text
      type: Richtext
      hint: true
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: illustration
      type: Picture
      hint: true

- name: code_sample
  hint: true
  ingredients:
    - role: caption
      type: Text
      hint: true
      default: :code_sample_caption
    - role: language
      type: Select
      hint: true
      default: yaml
      settings:
        select_values:
          - ["YAML", "yaml"]
          - ["Ruby", "ruby"]
          - ["ERB", "erb"]
          - ["HTML", "html"]
    - role: code
      type: Html
      hint: true
      default: :code_sample_code

# --- Gallery elements (Phase 2.2) ---

- name: image_gallery
  hint: true
  nestable_elements:
    - gallery_image
  autogenerate:
    - gallery_image
    - gallery_image
    - gallery_image
    - gallery_image
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :gallery_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]

- name: gallery_image
  compact: true
  hint: true
  ingredients:
    - role: image
      type: Picture
      hint: true
      settings:
        crop: true
        fixed_ratio: true
        size: "600x400"
        srcset:
          - "300x200"
          - "600x400"
          - "900x600"
        sizes:
          - "(min-width: 1024px) 300px"
          - "(min-width: 640px) 45vw"
          - "90vw"
    - role: caption
      type: Text
      hint: true
      default: :gallery_image_caption

# --- Blog elements (Phase 2.2) ---

- name: post_header
  unique: true
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :post_header_headline
      settings:
        levels: [1, 2]
        sizes: [1, 2]
    - role: published_at
      type: Datetime
      hint: true
    - role: author
      type: Text
      hint: true
      default: :post_header_author
    - role: image
      type: Picture
      hint: true
      settings:
        crop: true
        fixed_ratio: true
        size: "800x450"
        srcset:
          - "400x225"
          - "800x450"
          - "1200x675"
        sizes:
          - "(min-width: 768px) 720px"
          - "100vw"
    - role: intro
      type: Richtext
      hint: true
      default: :post_header_intro
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]

# --- Ingredients catalog element (Phase 2.2) ---

- name: ingredient_catalog
  unique: true
  hint: true
  ingredients:
    - role: text
      type: Text
    - role: headline
      type: Headline
      settings:
        levels: [3]
        sizes: [4]
    - role: richtext
      type: Richtext
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: picture
      type: Picture
      settings:
        size: 240x160
        crop: true
    - role: link
      type: Link
      settings:
        text: An example link
    - role: page
      type: Page
    - role: node
      type: Node
    - role: select
      type: Select
      settings:
        select_values:
          - ["First choice", "first"]
          - ["Second choice", "second"]
    - role: color
      type: Color
      settings:
        custom_color: true
    - role: datetime
      type: Datetime
    - role: boolean
      type: Boolean
    - role: number
      type: Number
    - role: html
      type: Html
    - role: audio
      type: Audio
      settings:
        only: [mp3, ogg, wav]
    - role: video
      type: Video
      settings:
        only: [mp4, webm, ogv]
    - role: file
      type: File
      settings:
        only: [pdf, doc, docx, txt]
    - role: event
      type: Event

# --- Events elements (Phase 2.2) ---

- name: event_teaser
  hint: true
  ingredients:
    - role: event
      type: Event
      hint: true

- name: events_overview
  hint: true
  ingredients:
    - role: headline
      type: Headline
      hint: true
      default: :events_overview_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]
    - role: timeframe
      type: Select
      hint: true
      default: upcoming
      settings:
        select_values:
          - ["Upcoming", "upcoming"]
          - ["Past", "past"]
          - ["All", "all"]
    - role: display
      type: Select
      group: styling
      hint: true
      default: timeline
      settings:
        select_values:
          - ["Timeline", "timeline"]
          - ["Calendar", "calendar"]

# --- Contact form element (Phase 2.2) ---

- name: contactform
  unique: true
  hint: true
  ingredients:
    - role: subject
      type: Text
      hint: true
      default: :contactform_subject
    - role: mail_to
      type: Text
      hint: true
    - role: success_page
      type: Page
      hint: true
