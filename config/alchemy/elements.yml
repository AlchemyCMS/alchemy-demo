# == In this configuration you setup Alchemy´s element layouts.
#
# For further informations please see http://guides.alchemy-cms.com/create_elements.html
- name: gallery
  unique: true
  nestable_elements:
    - gallery_picture
  autogenerate:
    - gallery_picture

- name: gallery_picture
  compact: true
  ingredients:
    - role: image
      type: Picture
      settings:
        size: 500x500
        crop: true
    - role: caption
      type: Text
      default: "Image Caption"

- name: category_intro
  unique: true
  ingredients:
    - role: image
      type: Picture
      settings:
        size: 303x393
        crop: true
    - role: header
      type: Text
      default: "Header"
    - role: text
      type: Richtext
      default: "Risus ligula, aliquam nec fermentum vitae, sollicitudin eget urna. Donec dignissim nibh fermentum odio ornare sagittis."

- name: blog_post
  ingredients:
    - role: title
      type: Text
      default: "Blog Post Title"
    - role: meta_data
      type: Text
      default: "Written by"
    - role: image
      type: Picture
      settings:
        size: 400x240
        crop: true
    - role: intro
      type: Richtext
      default: :blog_post_intro
    - role: body
      type: Richtext
      default: :blog_post_body

- name: video_slide
  ingredients:
    - role: video
      type: Text
      hint: Please paste a Vimeo video id into this field. The embed code is already included.

- name: image_slide
  ingredients:
    - role: image
      type: Picture
      settings:
        size: 1000x400
        crop: true

- name: content_block
  ingredients:
    - role: picture
      type: Picture
      settings:
        size: 400x300
        crop: true
    - role: headline
      type: Text
      default: This is a content section.
    - role: text
      type: Richtext
      default: <p>Bacon ipsum dolor sit amet nulla ham qui sint exercitation eiusmod commodo, chuck duis velit. Aute in reprehenderit, dolore aliqua non est magna in labore pig pork biltong. Eiusmod swine spare ribs reprehenderit culpa. Boudin aliqua adipisicing rump corned beef.</p>

- name: intro_text
  unique: true
  ingredients:
    - role: headline
      type: Text
      default: Header
    - role: subheader
      type: Text
      default: Risus ligula, aliquam nec fermentum vitae, sollicitudin eget urna. Donec dignissim nibh fermentum odio ornare sagittis.
    - role: text
      type: Richtext
      default: <p>Suspendisse ultrices ornare tempor. Aenean eget ultricies libero. Phasellus non ipsum eros. Vivamus at dignissim massa. Aenean dolor libero, blandit quis interdum et, malesuada nec ligula. Nullam erat erat, eleifend sed pulvinar ac. Suspendisse ultrices ornare tempor. Aenean eget ultricies libero.</p>

- name: text_block
  ingredients:
    - role: headline
      type: Text
      default: This is a headline.
    - role: text
      type: Richtext
      default: <p>Bacon ipsum dolor sit amet nulla ham qui sint exercitation eiusmod commodo, chuck duis velit. Aute in reprehenderit, dolore aliqua non est magna in labore pig pork biltong. Eiusmod swine spare ribs reprehenderit culpa. Boudin aliqua adipisicing rump corned beef.</p>
      settings:
        tinymce:
          toolbar1: "bold,italic,underline"
          toolbar2: ""

- name: call_to_action
  unique: true
  ingredients:
    - role: headline
      type: Text
      default: Get in touch!
    - role: text
      type: Richtext
      default: We'd love to hear from you, you attractive person you.

- name: image_teaser
  ingredients:
    - role: image
      type: Picture
      settings:
        size: 250x250
        crop: true
    - role: caption
      type: Text
      default: Subline

- name: portrait_image
  unique: true
  ingredients:
    - role: image
      type: Picture
      settings:
        size: 300x465
        crop: true

- name: footer_note
  unique: true
  ingredients:
    - role: body
      type: Text
      default: "Made with ❤️ and AlchemyCMS"

- name: social_button
  unique: true

- name: slider
  fixed: true
  unique: true
  nestable_elements:
    - video_slide
    - image_slide
  autogenerate:
    - video_slide
    - image_slide

# --- Guided tour elements (Phase 2.2) ---

- name: hero
  unique: true
  hint: true
  ingredients:
    - role: headline
      type: Headline
      as_element_title: true
      hint: true
      default: :hero_headline
      settings:
        levels: [1]
        sizes: [1, 2]
    - role: subheadline
      type: Text
      hint: true
      default: :hero_subheadline
    - role: cta
      type: Link
      hint: true
      default: "#concepts"
      settings:
        text: Explore the tour

- name: concept_grid
  unique: true
  hint: true
  nestable_elements:
    - concept_card
  autogenerate:
    - concept_card
    - concept_card
    - concept_card
  ingredients:
    - role: headline
      type: Headline
      as_element_title: true
      hint: true
      default: :concepts_headline
      settings:
        anchor: concepts
        levels: [2, 3]
        sizes: [2, 3]

- name: concept_card
  compact: true
  hint: true
  ingredients:
    - role: title
      type: Headline
      as_element_title: true
      hint: true
      default: :concept_card_title
      validate:
        - presence
      settings:
        levels: [3, 4]
        sizes: [4, 5]
    - role: description
      type: Richtext
      hint: true
      default: :concept_card_description
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: link
      type: Link
      hint: true
      settings:
        text: Learn more

- name: cta
  unique: true
  hint: true
  ingredients:
    - role: headline
      type: Headline
      as_element_title: true
      hint: true
      default: :cta_headline
      settings:
        levels: [2, 3]
        sizes: [2, 3]
    - role: text
      type: Richtext
      hint: true
      default: :cta_text
      settings:
        tinymce:
          toolbar: "bold italic | alchemy_link unlink"
        sanitizer:
          tags: [p, br, strong, em, a]
          attributes: [href, target, rel, title]
    - role: button
      type: Link
      hint: true
      default: "/admin"
      settings:
        text: Open the admin
