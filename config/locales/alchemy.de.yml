de:
  alchemy:
    user_roles:
      demo: Demo

    # Translations for page layout names
    page_layout_names:
      index: Startseite

    # Translations for element names
    element_names:
      article: Artikel

    # Translations for content names
    content_names:
      headline: Überschrift
      text: Text
      picture: Bild

    # Default texts for new contents created
    default_content_texts:
      article_headline: "Willkommen auf Ihrer Alchemy Seite"
      article_text: '<p>Als erstes sollte man sich mit der Struktur von Alchemy vertraut machen. <a class="external" href="https://guides.alchemy-cms.com/about.html#storing-architecture" target="_blank" data-link-target="blank">Mehr dazu in den Guidelines</a>.</p><p>Die wichtigsten beiden Dinge die man über Alchemy wissen muss sind Elemente und Seitentypen.</p><p><span style="text-decoration: underline;"><strong>Elemente:</strong></span></p><p>Mit Alchemy kann man eine Seite in Inhaltsbereiche aufteilen, Elemente. Diese Elemente werden aus verschiedenen Grundtypen (Ingredients) zusammengesetzt. Die Ingredients sind:</p><ul><li>Text - <em>Eine Zeile Text</em></li><li>Richtext - <em>Ein TinyMCE basierter formatierter Textblock</em></li><li>Picture - <em>Ein Verweis auf ein Bild</em></li><li>Html - <em>HTML Code</em></li><li>Select - <em>Eine Auswahl aus einer Liste an Werten</em></li><li>Boolean - <em>Eine Checkbox</em></li></ul><p>Elemente werden in einer YAML Datei definiert: <strong>config/alchemy/elements.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/elements.html" target="_blank" data-link-target="blank">Mehr über Elemente und wie sie definiert werden, kann in den Guidelines nachgelesen werden.</a></p><p><span style="text-decoration: underline;"><strong>Seitentypen:</strong></span></p><p>Es können verschiedene Seitentypen definiert werden. Diesen können Elemente zugewiesen und ihr Verhalten definiert werden.</p><p>Seitentypen werden ein einer YAML Datei definiert: <strong>config/alchemy/page_layouts.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/page_layouts.html" target="_blank" data-link-target="blank">Mehr über das Erstellen von Seitentypen kann in den Guidelines nachgelesen werden.</a></p>'
      blog_post_intro: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      blog_post_body: "<h2>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h2><p>Id enim volumus, id contendimus, ut officii fructus sit ipsum officium. Oratio me istius philosophi non offendit; Quid ad utilitatem tantae pecuniae? Atqui iste locus est, Piso, tibi etiam atque etiam confirmandus, inquam; Quis Aristidem non mortuum diligit? Huic mori optimum esse propter desperationem sapientiae, illi propter spem vivere. Duo Reges: constructio interrete. Non quaeritur autem quid naturae tuae consentaneum sit, sed quid disciplinae. Nunc dicam de voluptate, nihil scilicet novi, ea tamen, quae te ipsum probaturum esse confidam.</p>"

    # Hint texts for elements
    element_hints:
      article: "Dies ist ein Hinweistext für das Artikel Element. Dieser Text kann in der `config/locales/alchemy.de.yml` Datei angepasst werden."
      hero: "Der Eröffnungs-Banner der Seite: Überschrift, ergänzende Zeile und Call-to-Action."
      concept_grid: "Ein Raster aus Konzeptkarten. Karten nach Bedarf hinzufügen oder entfernen."
      concept_card: "Ein Konzept im Raster: Titel, kurze Beschreibung und optionaler Link."
      cta: "Ein abschließender Call-to-Action-Banner."
      button: "Ein einzelner Button – lege seinen Link fest und wähle seine Farbe."
      concept_intro: "Der Intro-Bereich einer Konzeptseite: ein Label, eine Überschrift (mit Anker aus ihrem Text) und ein einleitender Absatz."
      prose: "Ein Rich-Text-Block mit Überschrift."
      image_text: "Ein Bild neben Text; die Bildseite ist umschaltbar."
      callout: "Ein hervorgehobener Hinweis – Info, Tipp oder Warnung."
      code_sample: "Ein syntaxhervorgehobenes Code-Snippet in der gewählten Sprache."
      image_gallery: "Eine Galerie aus verschachtelten gallery_image-Elementen – hinzufügen, entfernen und umsortieren."
      gallery_image: "Ein Bild in der Galerie: auf ein festes Seitenverhältnis zugeschnitten und responsiv per srcset ausgeliefert."
      post_header: "Der Kopf eines Blogartikels – Überschrift, Datum, Autor, Bild und Einleitung. Die Übersicht zeigt diese Felder als Teaser."

    # Hint texts for contents
    content_hints:
      headline: "Dies ist ein einzeiliger unformatierter Text"
      picture: "Bilder werden in der Bibliothek gespeichert. Ein Bild kann mehrfach einem Element zugewiesen werden. Auch ein Bildauswahlwerkzeug ist in Alchemy integriert."
      text: "Dies ist ein formatierbarer Textblock. Die Einstellungen des Editors können angepasst werden. Siehe http://guides.alchemy-cms.com/stable/customize_tinymce.html"

    menu_names:
      footer_navigation: Footer-Navigation
      main_navigation: Hauptnavigation

    # Übersetzte Standardtexte für die Tour-Ingredients (Symbol-Defaults)
    default_ingredient_texts:
      hero_headline: "Inhalte bauen wie ein Alchemist."
      hero_subheadline: "Alchemy strukturiert Inhalte als wiederverwendbare Elemente, die aus typisierten Ingredients bestehen. Diese Website ist komplett mit Alchemy gebaut – öffne einen Block, um zu sehen wie."
      concepts_headline: "Grundkonzepte"
      concept_card_title: "Ein Grundkonzept"
      concept_card_description: "<p>Ein Element ist ein wiederverwendbarer Inhaltsblock aus typisierten Ingredients. Bearbeite diesen Text im Admin.</p>"
      cta_headline: "Bereit, Alchemy auszuprobieren?"
      cta_text: "<p>Melde dich im Demo-Admin an und bearbeite diese Elemente selbst.</p>"
      concept_intro_eyebrow: "Grundkonzept"
      concept_intro_headline: "Elemente"
      concept_intro_lead: "<p>Ein <strong>Element</strong> ist ein wiederverwendbarer Inhaltsblock, den du auf einer Seite platzierst. Jedes Element wird in elements.yml definiert und besteht aus typisierten Ingredients.</p>"
      prose_headline: "Eine Seite aus Elementen zusammensetzen"
      prose_text: "<p>Ein Page Layout legt fest, welche Elemente eine Seite enthalten darf. Redakteure können dann:</p><ul><li>Elemente hinzufügen und entfernen,</li><li>sie sortieren und verschachteln,</li><li>ihre Ingredients ausfüllen.</li></ul><p>Das Frontend rendert jedes Element mit seinem eigenen View-Partial.</p>"
      image_text_headline: "Jedes Element hat einen View"
      image_text_text: "<p>Elemente werden über ein Partial in app/views/alchemy/elements gerendert – ihr Markup liegt vollständig in deiner Hand.</p>"
      callout_text: "<p><strong>Tipp:</strong> Öffne „Wie dieser Block gebaut ist“ an jedem Block, um seine genaue Definition zu sehen und direkt im Admin dorthin zu springen.</p>"
      code_sample_caption: "config/alchemy/elements.yml"
      gallery_headline: "Eine verschachtelbare Galerie"
      gallery_image_caption: "Ein zugeschnittenes, responsives Bild"
      post_header_headline: "Ein Blogbeitrag"
      post_header_author: "Das Alchemy-Team"
      post_header_intro: "<p>Eine kurze Einleitung zu diesem Beitrag.</p>"
      code_sample_code: |
        - name: prose
          ingredients:
            - role: headline
              type: Headline
            - role: text
              type: Richtext

    # Übersetzte Editor-Hinweise je Ingredient-Rolle (hint: true)
    ingredient_hints:
      headline: "Ein Headline-Ingredient. Level bestimmt das semantische Tag (h1–h6) für Struktur und SEO; Size die visuelle Größe unabhängig vom Level; und wenn ein Anchor gesetzt ist, erzeugt er eine feste #id, auf die du direkt verlinken kannst."
      subheadline: "Eine kurze ergänzende Zeile unter der Überschrift."
      cta: "Der Call-to-Action-Link. Verlinke eine Seite oder einen Anker auf der Seite."
      title: "Die Überschrift der Karte (ein Headline-Ingredient). Wähle das semantische Level (h3 oder h4) und – unabhängig davon – die visuelle Size."
      description: "Eine kurze Rich-Text-Beschreibung. Nur Fett, Kursiv und Links sind erlaubt."
      link: "Ein optionaler Link am Ende der Karte."
      text: "Ein Rich-Text-Block; die verfügbare Formatierung ist auf das beschränkt, was dieses Element braucht."
      button: "Der Button-Link des Call-to-Action."
      eyebrow: "Ein kurzes Label über der Überschrift."
      lead: "Der einleitende Absatz unter der Überschrift."
      variant: "Der Callout-Stil – Info, Tipp oder Warnung – als Select-Wert gespeichert."
      language: "Die Programmiersprache, zur Wahl des Syntax-Highlighters."
      caption: "Ein optionales Label über dem Code."
      code: "Das Code-Snippet (ein Textbereich); es wird im Frontend hervorgehoben."
      layout: "Auf welcher Seite das Bild sitzt, als Tailwind-CSS-Klasse gespeichert."
      image: "Das Bild. Zugeschnitten und responsiv über srcset/sizes ausgeliefert."
      published_at: "Wann der Artikel veröffentlicht wurde (ein Datetime-Ingredient)."
      author: "Der Autor des Artikels."
      intro: "Eine kurze Einleitung, die im Artikel und als Teaser auf der Blog-Übersicht erscheint."
      background: "Hintergrund-Stil, gewählt aus einem Select, dessen Werte Tailwind-CSS-Klassen sind."
      button_style: "Button-Farben, gewählt aus einem Select, dessen Werte Tailwind-CSS-Klassen sind."
      color: "Ein Color-Ingredient – wähle eine Markenfarbe oder eine eigene mit dem Farbwähler; wird als Hex-Wert gespeichert und als Inline-Style angewendet."
      label: "Der Link des Buttons; der sichtbare Text kommt aus dem Linktitel."

    # Übersetzte Gruppen-Überschriften im Element-Editor
    element_groups:
      styling: "Gestaltung"
