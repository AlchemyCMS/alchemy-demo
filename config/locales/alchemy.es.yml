es:
  alchemy:
    user_roles:
      demo: Demo

    # Alchemy incluye traducciones para muchos tipos MIME, pero no para Ogg
    mime_types:
      audio/ogg: Audio Ogg

    # Translations for page layout names
    page_layout_names:
      index: Inicio

    # Translations for element names
    element_names:
      article: Artículo

    # Translations for content names
    content_names:
      headline: Titular
      text: Texto
      picture: Imagen

    # Default texts for new contents created
    default_content_texts:
      article_headline: "Bienvenido a tu primera página de Alchemy CMS"
      article_text: '<p><strong>Como empezar.</strong></p><p>Lo primero de todo deberías leer sobre Alchemy y su arquitectura en las <a class="external" href="http://guides.alchemy-cms.com/stable/alchemy_approach.html" target="_blank" data-link-target="blank">guías</a>.</p><p>Las cosas más importantes que debes saber sobre Alchemy son elementos (<i>elements</i>) y disposiciones de página (<i>page layouts</i>).</p><p><span style="text-decoration: underline;"><strong>Elementos:</strong></span></p><p>Con Alchemy puedes dividir las páginas en partes de contenido, elementos. Estos elementos se pueden definir mediante varios tipos de contenido básicos: ingredientes (<i>ingredients</i>). Las ingredientes básicas son:</p><ul><li>Text - <em>Un única línea de texto</em></li><li>Richtext - <em>Un bloque de texto formateado mediante TinyMCE</em></li><li>Picture - <em>Una referencia a una imagen</em></li><li>Html - <em>Código HTML empotrado</em></li><li>Select - <em>Una selección de valores</em></li><li>Boolean - <em>Una casilla de verificación</em></li></ul><p>Los elementos se definen en el fichero YAML <strong>config/alchemy/elements.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/elements.html" target="_blank" data-link-target="blank">Lee más sobre elementos y cómo definirlos en las guías.</a></p><p><span style="text-decoration: underline;"><strong>Tipos de página:</strong></span></p><p>Puedes definir varios tipos de páginas, llamados disposiciones de páginas (<i>page layouts</i>). Puedes asignar elementos a las disposiciones de páginas y controlar cómo se comportan los elementos y una página con una disposición concreta.</p><p>Las disposiciones de páginas se definen en el fichero YAML <strong>config/alchemy/page_layouts.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/page_layouts.html" target="_blank" data-link-target="blank">Lee más sobre definir disposiciones de páginas en las guías.</a></p>'
      blog_post_intro: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      blog_post_body: "<h2>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h2><p>Id enim volumus, id contendimus, ut officii fructus sit ipsum officium. Oratio me istius philosophi non offendit; Quid ad utilitatem tantae pecuniae? Atqui iste locus est, Piso, tibi etiam atque etiam confirmandus, inquam; Quis Aristidem non mortuum diligit? Huic mori optimum esse propter desperationem sapientiae, illi propter spem vivere. Duo Reges: constructio interrete. Non quaeritur autem quid naturae tuae consentaneum sit, sed quid disciplinae. Nunc dicam de voluptate, nihil scilicet novi, ea tamen, quae te ipsum probaturum esse confidam.</p>"

    # Hint texts for elements
    element_hints:
      hero: "El banner de apertura de la página: un encabezado, una línea de apoyo y una llamada a la acción."
      concept_grid: "Una cuadrícula de tarjetas de concepto. Añade o quita tarjetas según necesites."
      concept_card: "Un concepto en la cuadrícula: título, breve descripción y enlace opcional."
      cta: "Un banner final de llamada a la acción."
      button: "Un botón independiente: define su enlace y elige su color."
      concept_intro: "La introducción de una página de concepto: una etiqueta, un encabezado (con ancla a partir de su texto) y un párrafo inicial."
      prose: "Un bloque de texto enriquecido con encabezado."
      image_text: "Una imagen junto a texto; el lado de la imagen es intercambiable."
      callout: "Una nota destacada: información, consejo o advertencia."
      code_sample: "Un fragmento de código con resaltado de sintaxis en el idioma elegido."
      image_gallery: "Una galería de elementos gallery_image anidados: añade, quita y reordena."
      gallery_image: "Una imagen de la galería: recortada a una proporción fija y servida de forma responsiva con srcset."
      post_header: "La cabecera de un artículo de blog: encabezado, fecha, autor, imagen e introducción. El resumen muestra estos campos."
      contactform: "Un formulario de contacto con los Messages integrados de Alchemy. Define el asunto, un destinatario opcional y la página de agradecimiento."
      event_teaser: "Destaca un único Evento mediante un tipo de Ingredient propio que referencia un registro del módulo de administración de Eventos."
      events_overview: "Lista muchos Eventos directamente desde el modelo Event propio. Elige un periodo y un diseño; aquí no se guarda contenido por evento."
      ingredient_catalog: "Un ingredient de cada tipo integrado (más uno propio), para ver qué guarda y cómo se muestra cada Ingredient."

    # Hint texts for contents
    content_hints:
      headline: "Esta es una sencilla linea de texto sin formato"
      picture: "Las imágenes se almacenan en la librería. Puedes asignar una imagen varias veces en tu sitio. Alchemy tiene una herramienta de recorte de imagen integrada."
      text: "Este es un bloque de texto enriquecido mediante el editor TinyMCE. Puedes cambiar la configuración del editor. Ver http://guides.alchemy-cms.com/stable/customize_tinymce.html"

    menu_names:
      footer_navigation: Navegación de pie de página
      main_navigation: Navegación Principal

    # Textos por defecto traducidos para los ingredients de la visita guiada
    default_ingredient_texts:
      hero_headline: "Crea contenido como un químico."
      hero_subheadline: "Alchemy estructura el contenido en Elementos reutilizables, formados por Ingredientes tipados. Todo este sitio está hecho con Alchemy: abre cualquier bloque para ver cómo."
      concepts_headline: "Conceptos básicos"
      concept_card_title: "Un concepto básico"
      concept_card_description: "<p>Un Elemento es un bloque de contenido reutilizable, hecho de Ingredientes tipados. Edita este texto en el admin.</p>"
      cta_headline: "¿Listo para probar Alchemy?"
      cta_text: "<p>Inicia sesión en el admin de demostración y edita estos Elementos tú mismo.</p>"
      concept_intro_eyebrow: "Concepto básico"
      concept_intro_headline: "Elementos"
      concept_intro_lead: "<p>Un <strong>Elemento</strong> es un bloque de contenido reutilizable que colocas en una Página. Cada Elemento se define en elements.yml y se compone de Ingredientes tipados.</p>"
      prose_headline: "Componer una página con Elementos"
      prose_text: "<p>Un Page Layout indica qué Elementos puede contener una página. Los editores pueden entonces:</p><ul><li>añadir y quitar Elementos,</li><li>ordenarlos y anidarlos,</li><li>rellenar sus Ingredientes.</li></ul><p>El frontend renderiza cada Elemento con su propio partial de vista.</p>"
      image_text_headline: "Cada Elemento tiene una vista"
      image_text_text: "<p>Los Elementos se renderizan mediante un partial en app/views/alchemy/elements, así que su marcado está totalmente bajo tu control.</p>"
      callout_text: "<p><strong>Consejo:</strong> abre «Cómo se construye este bloque» en cualquier bloque para ver su definición exacta y saltar directamente a él en el admin.</p>"
      code_sample_caption: "config/alchemy/elements.yml"
      gallery_headline: "Una galería anidable"
      gallery_image_caption: "Una imagen recortada y responsiva"
      post_header_headline: "Una entrada de blog"
      post_header_author: "El equipo de Alchemy"
      post_header_intro: "<p>Una breve introducción a esta entrada.</p>"
      contactform_subject: "Nuevo mensaje del formulario de contacto"
      events_overview_headline: "Eventos"
      code_sample_code: |
        - name: prose
          ingredients:
            - role: headline
              type: Headline
            - role: text
              type: Richtext

    # Ayudas de editor traducidas por rol de ingredient (hint: true)
    ingredient_hints:
      headline: "Un Ingrediente Headline. Level define la etiqueta semántica (h1–h6) para estructura y SEO; Size el tamaño visual independientemente del level; y donde hay un anchor configurado, añade un #id estable al que puedes enlazar directamente."
      subheadline: "Una línea de apoyo breve bajo el encabezado."
      cta: "El enlace de llamada a la acción. Apúntalo a una página o a un ancla en la página."
      title: "El encabezado de la tarjeta (un Ingrediente Headline). Elige su Level semántico (h3 o h4) y, de forma independiente, su Size visual."
      description: "Una breve descripción en texto enriquecido. Solo se permiten negrita, cursiva y enlaces."
      link: "Un enlace opcional al pie de la tarjeta."
      text: "Un bloque de texto enriquecido; el formato disponible se limita a lo que necesita este elemento."
      button: "El enlace del botón de llamada a la acción."
      eyebrow: "Una etiqueta breve mostrada sobre el encabezado."
      lead: "El párrafo introductorio bajo el encabezado."
      variant: "El estilo del callout: información, consejo o advertencia, guardado como valor de Select."
      language: "El lenguaje de programación, usado para elegir el resaltador de sintaxis."
      caption: "Una etiqueta opcional mostrada sobre el código."
      code: "El fragmento de código (un área de texto); se resalta en el frontend."
      layout: "En qué lado se sitúa la imagen, guardado como clase CSS de Tailwind."
      image: "La imagen. Recortada y servida de forma responsiva con srcset/sizes."
      illustration: "Una ilustración opcional mostrada en la parte superior de la tarjeta."
      published_at: "Cuándo se publicó el artículo (un Ingrediente Datetime)."
      author: "El autor del artículo."
      intro: "Una breve introducción que aparece en el artículo y como avance en el resumen del blog."
      subject: "El asunto del correo para los mensajes enviados."
      mail_to: "Destinatario opcional; por defecto usa la configuración del mailer."
      success_page: "La página a la que se redirige tras enviar un mensaje."
      background: "Estilo de fondo, elegido de un Select cuyos valores son clases CSS de Tailwind."
      background_image: "Una imagen de fondo opcional, a todo ancho tras el texto del hero con una capa oscura."
      filter: "Un filtro CSS aplicado a la imagen de fondo, guardado como clase de Tailwind."
      button_style: "Colores del botón, elegidos de un Select cuyos valores son clases CSS de Tailwind."
      color: "Un Ingrediente Color: elige un color de marca o uno personalizado con el selector; se guarda como valor hex y se aplica como estilo en línea."
      label: "El enlace del botón; el texto visible proviene del título del enlace."
      event: "Un Ingredient Event propio. Su valor referencia un registro Event gestionado en el módulo de administración de Eventos."
      timeframe: "Qué Eventos se listan, guardado como valor de Select: próximos, pasados o todos."
      display: "Cómo se muestra la lista — una línea de tiempo o una agenda tipo calendario."

    # Encabezados de grupo traducidos en el editor de elementos
    element_groups:
      styling: "Estilo"

    # Nombres de navegación de módulos de administración propios
    modules:
      events: "Eventos"
