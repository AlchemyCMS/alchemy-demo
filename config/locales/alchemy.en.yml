en:
  alchemy:
    user_roles:
      demo: Demo

    # Alchemy ships translations for many mime types but not Ogg
    mime_types:
      audio/ogg: Ogg Audio

    # Translations for page layout names
    page_layout_names:
      index: Homepage

    # Translations for element names
    element_names:
      article: Article
      gallery_picture: Gallery Picture
      footer_links_link: Footer Link

    # Translations for content names
    content_names:
      headline: Headline
      text: Text
      picture: Picture

    # Default texts for new contents created
    default_content_texts:
      article_headline: "Welcome to your first Alchemy CMS page"
      article_text: '<p><strong>How to get started.</strong></p><p>First of all you should read about Alchemy and its architecture in the <a class="external" href="http://guides.alchemy-cms.com/stable/alchemy_approach.html" target="_blank" data-link-target="blank">guidelines</a>.</p><p>The most important things to know about Alchemy are elements and page layouts.</p><p><span style="text-decoration: underline;"><strong>Elements:</strong></span></p><p>With Alchemy you can split pages into content parts, elements. These elements can be defined out of several base content types: ingredients. The built in ingredients are:</p><ul><li>Text - <em>A single line of text</em></li><li>Richtext - <em>A TinyMCE powered formatted text block</em></li><li>Picture - <em>A reference to an image</em></li><li>Html - <em>HTML embed code</em></li><li>Select - <em>A selection of a list of values</em></li><li>Boolean - <em>A checkbox</em></li></ul><p>Elements get defined in a YAML file <strong>config/alchemy/elements.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/elements.html" target="_blank" data-link-target="blank">Read more about elements and how to define them in the guidelines.</a></p><p><span style="text-decoration: underline;"><strong>Page types:</strong></span></p><p>You can define several types of pages, called page layouts. You can assign elements to page layouts and control how elements and the page of a certain layout behave.</p><p>Page layouts get defined in a YAML file <strong>config/alchemy/page_layouts.yml</strong></p><p><a class="external" href="http://guides.alchemy-cms.com/stable/page_layouts.html" target="_blank" data-link-target="blank">Read more about defining page layouts in the guidelines.</a></p>'
      blog_post_intro: Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      blog_post_body: "<h2>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</h2><p>Id enim volumus, id contendimus, ut officii fructus sit ipsum officium. Oratio me istius philosophi non offendit; Quid ad utilitatem tantae pecuniae? Atqui iste locus est, Piso, tibi etiam atque etiam confirmandus, inquam; Quis Aristidem non mortuum diligit? Huic mori optimum esse propter desperationem sapientiae, illi propter spem vivere. Duo Reges: constructio interrete. Non quaeritur autem quid naturae tuae consentaneum sit, sed quid disciplinae. Nunc dicam de voluptate, nihil scilicet novi, ea tamen, quae te ipsum probaturum esse confidam.</p>"

    # Hint texts for elements
    element_hints:
      hero: "The page's opening banner: a headline, a supporting line and a call-to-action."
      concept_grid: "A grid of concept cards. Add or remove cards as needed."
      concept_card: "One concept in the grid: a title, a short description and an optional link."
      cta: "A closing call-to-action banner."
      button: "A standalone button — set its link and pick its colour."
      concept_intro: "The intro for a concept page: an eyebrow label, a headline (with an anchor from its text) and a lead paragraph."
      prose: "A block of rich text with a heading."
      image_text: "An image beside text; the image side is switchable."
      callout: "A highlighted note — info, tip or warning."
      code_sample: "A syntax-highlighted code snippet in the chosen language."
      image_gallery: "A gallery of nested gallery_image elements — add, remove and reorder them."
      gallery_image: "One image in the gallery: cropped to a fixed ratio and served responsively via srcset."
      post_header: "A blog article's header — headline, date, author, image and intro. The overview page teases these fields."
      contactform: "A contact form powered by Alchemy's built-in Messages. Set the subject, an optional recipient and the page shown after sending."
      event_teaser: "Features a single Event using a custom Ingredient type that references a record from the Events admin module."
      events_overview: "Lists many Events straight from the custom Event model. Pick a timeframe and a layout — no per-event content is stored here."
      ingredient_catalog: "One ingredient of every built-in type (plus a custom one), so you can see what each Ingredient stores and renders."

    # Hint texts for contents
    content_hints:
      headline: "This is a single line of unformatable Text"
      picture: "Pictures are stored in the library. You can assign a picture multiple times throughout your site. Alchemy has an image cropper build right in."
      text: "This is a rich text block powered by TinyMCE editor. You can change the configuration of the editor. See http://guides.alchemy-cms.com/stable/customize_tinymce.html"

    menu_names:
      footer_navigation: Footer Navigation
      main_navigation: Main Navigation

    # Translated default texts for guided-tour ingredients (symbol defaults)
    default_ingredient_texts:
      hero_headline: "Build content like a chemist."
      hero_subheadline: "Alchemy structures content as reusable Elements, each built from typed Ingredients. This whole site is made with Alchemy — open any block to see how."
      concepts_headline: "Core concepts"
      concept_card_title: "A core concept"
      concept_card_description: "<p>An Element is a reusable content block, made of typed Ingredients. Edit this text in the admin.</p>"
      cta_headline: "Ready to try Alchemy?"
      cta_text: "<p>Log in to the demo admin and edit these Elements yourself.</p>"
      concept_intro_eyebrow: "Core concept"
      concept_intro_headline: "Elements"
      concept_intro_lead: "<p>An <strong>Element</strong> is a reusable content block you place on a Page. Each Element is defined in elements.yml and made of typed Ingredients.</p>"
      prose_headline: "Composing a page from Elements"
      prose_text: "<p>A Page Layout lists which Elements a page may contain. Editors then:</p><ul><li>add and remove Elements,</li><li>sort and nest them,</li><li>fill in their Ingredients.</li></ul><p>The frontend renders each Element with its own view partial.</p>"
      image_text_headline: "Every Element has a view"
      image_text_text: "<p>Elements render through a partial in app/views/alchemy/elements, so their markup is entirely under your control.</p>"
      callout_text: "<p><strong>Tip:</strong> open “How this block is built” on any block to see its exact definition and jump straight to it in the admin.</p>"
      code_sample_caption: "config/alchemy/elements.yml"
      gallery_headline: "A nestable gallery"
      gallery_image_caption: "A cropped, responsive image"
      post_header_headline: "A blog post"
      post_header_author: "The Alchemy Team"
      post_header_intro: "<p>A short introduction to this post.</p>"
      contactform_subject: "New contact form message"
      events_overview_headline: "Events"
      code_sample_code: |
        - name: prose
          ingredients:
            - role: headline
              type: Headline
            - role: text
              type: Richtext

    # Translated editor hints per ingredient role (hint: true)
    ingredient_hints:
      headline: "A Headline ingredient. Level sets the semantic tag (h1–h6) for structure and SEO; Size sets the visual scale independently of the level; and where an anchor is configured, it adds a stable #id so you can link straight to this heading."
      subheadline: "A short supporting line shown under the headline."
      cta: "The call-to-action link. Point it at a page or an on-page anchor."
      title: "The card's heading (a Headline ingredient). Pick its semantic Level (h3 or h4) and, independently, its visual Size."
      description: "A short rich-text description. Only bold, italic and links are allowed."
      link: "An optional link shown at the bottom of the card."
      text: "A rich-text block; the available formatting is limited to what this element needs."
      button: "The call-to-action button link."
      eyebrow: "A short label shown above the headline."
      lead: "The intro paragraph shown under the headline."
      variant: "The callout style — info, tip or warning — stored as a Select value."
      language: "The programming language, used to pick the syntax highlighter."
      caption: "An optional label shown above the code."
      code: "The code snippet (a plain-text area); it is highlighted on the frontend."
      layout: "Which side the image sits on, stored as a Tailwind CSS class."
      image: "The picture. Cropped and served responsively via srcset/sizes."
      illustration: "An optional illustration shown at the top of the card."
      published_at: "When the article was published (a Datetime ingredient)."
      author: "The article's author."
      intro: "A short intro shown on the article and teased on the blog overview."
      subject: "The email subject for submitted messages."
      mail_to: "Optional recipient override; defaults to the mailer config."
      success_page: "The page to redirect to after a message is sent."
      background: "Background style, chosen from a Select whose values are Tailwind CSS classes."
      background_image: "An optional background image, shown full-width behind the hero text with a dark overlay."
      filter: "A CSS filter applied to the background image, stored as a Tailwind class."
      button_style: "Button colours, chosen from a Select whose values are Tailwind CSS classes."
      color: "A Color ingredient — pick a brand colour or a custom one with the colour picker; stored as a hex value and applied as an inline style."
      label: "The button's link; the visible text comes from the link title."
      event: "A custom Event ingredient. Its value references an Event record managed in the Events admin module."
      timeframe: "Which Events to list, stored as a Select value: upcoming, past or all."
      display: "How the list is rendered — a timeline or a calendar-style agenda."

    # Translated ingredient group headings shown in the element editor
    element_groups:
      styling: "Styling"

    # Custom admin module navigation names
    modules:
      events: "Events"
